:root{--preto:#111111;--cinza-escuro:#646464;--cinza-claro:#C8C8C8;--trilho:#EAEAEA;--fundo-bloco:#F4F4F4;--ac:#111111;--ac-rgb:17,17,17;--on-ac:#ffffff;--verde:#2E7D32;--amarelo:#D9A400;--vermelho:#C62828}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--preto);font-family:N27,"Poppins","Century Gothic",sans-serif;font-size:14px;line-height:1.45}
button,select,input{font-family:inherit;color:inherit}
.up{text-transform:uppercase;letter-spacing:.03em}
.b{font-weight:700}
.mut{color:var(--cinza-escuro)}
.peq{font-size:11px}
.el{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#raiz{padding:16px 18px 20px;max-width:1600px;margin:0 auto}

/* Cabeçalho */
.cab{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;padding-bottom:10px;border-bottom:3px solid var(--ac)}
.marca{font-size:11px;color:var(--cinza-escuro);letter-spacing:.08em}
.titulo{font-size:22px;font-weight:700;line-height:1.1;margin-top:2px}
.barra-ferr{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{font-size:11px;background:#fff;border:1px solid var(--cinza-claro);border-radius:6px;padding:4px 9px;cursor:pointer;line-height:1.4;white-space:nowrap}
.btn:hover{border-color:var(--cinza-escuro)}
.btn.on{background:var(--ac);border-color:var(--ac);color:var(--on-ac)}
.grupo-btn{display:inline-flex}
.grupo-btn .btn{border-radius:0;margin-left:-1px}
.grupo-btn .btn:first-child{border-radius:6px 0 0 6px;margin-left:0}
.grupo-btn .btn:last-child{border-radius:0 6px 6px 0}
select.btn{padding-right:6px}
a.btn{color:var(--preto);text-decoration:none}
.mini{margin-top:6px;border-top:1px solid #F0F0F0;padding-top:5px;display:grid;gap:4px}
.mini{grid-template-columns:minmax(0,1fr)}.mini>div{min-width:0}
.mini .peq{display:flex;justify-content:space-between;gap:6px}.mini .peq .el{min-width:0;flex:1}
.ponto{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}

/* Indicadores */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:12px 0 4px}
.kpi{background:var(--fundo-bloco);border-radius:8px;padding:10px 12px;min-width:0}
.kpi .v{font-size:24px;font-weight:700;line-height:1.2}

/* Elementos comuns */
.trilho{height:6px;background:var(--trilho);border-radius:3px;overflow:hidden}
.trilho>i{display:block;height:100%;border-radius:3px}
.no{background:#fff;border:1px solid var(--cinza-claro);border-radius:8px;padding:8px 10px;cursor:pointer;min-width:0;transition:border-color .12s}
.no:hover{border-color:var(--cinza-escuro)}
.no .nome{font-size:12px;font-weight:700}
.no .pct{font-size:12px;font-weight:700;min-width:44px;text-align:right}
.linha{display:flex;gap:8px;align-items:center}
.secao{font-size:11px;color:var(--cinza-escuro);font-weight:700;margin:14px 0 6px;letter-spacing:.06em}

/* Árvore */
.arv-raiz{max-width:260px;margin:14px auto 0}
.arv-tronco{width:1px;height:14px;background:var(--cinza-claro);margin:0 auto}
.arv-cols{display:grid;gap:10px;border-top:1px solid var(--cinza-claro);padding-top:12px}
.arv-col{display:grid;gap:6px;align-content:start;min-width:0}
.arv-col .tit{text-align:center;font-size:11px;font-weight:700;color:var(--cinza-escuro);letter-spacing:.06em}
.recuo{border-left:1px solid var(--cinza-claro);padding-left:8px}

/* Cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.card{padding:11px 12px}
.card .okr{margin-top:6px}

/* Ranking */
.rk{display:grid;grid-template-columns:minmax(0,1fr) 140px 52px;gap:12px;align-items:center;padding:7px 4px;border-bottom:1px solid #EFEFEF;cursor:pointer}
.rk:hover{background:var(--fundo-bloco)}

/* Mapa de calor */
.calor{display:grid;gap:3px;font-size:11px;align-items:stretch}
.cel{display:flex;align-items:center;justify-content:center;border-radius:4px;padding:7px 2px;cursor:pointer;font-weight:700}
.cel.vazia{cursor:default}

/* Evolução */
.ev-area{border:1px solid var(--cinza-claro);border-radius:8px;padding:12px;margin-bottom:8px}
.ev-lin{display:grid;grid-template-columns:minmax(0,1fr) 64px 64px 70px;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid #F1F1F1;font-size:12px}
.ev-lin:last-child{border-bottom:0}
.delta{font-weight:700;text-align:right}

/* Detalhe */
.veu{position:fixed;inset:0;background:rgba(17,17,17,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:20;overflow:auto}
.modal{background:#fff;border-radius:10px;max-width:620px;width:100%;padding:16px 18px;border-top:4px solid var(--ac)}
.kr{border:1px dashed var(--cinza-claro);border-radius:6px;padding:8px 10px;font-size:12px}

/* Rodapé */
.rodape{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:16px;padding-top:8px;border-top:1px solid #EFEFEF;font-size:11px;color:var(--cinza-escuro)}
.aviso{background:var(--fundo-bloco);border-left:3px solid var(--ac);padding:6px 10px;font-size:11px;margin-top:10px}

/* Login e mensagens */
.centro{max-width:340px;margin:60px auto;text-align:center}
.centro input{width:100%;padding:8px 10px;border:1px solid var(--cinza-claro);border-radius:6px;margin-top:8px;font-size:13px}
.erro{color:var(--vermelho);font-size:12px;margin-top:8px}

/* Modo apresentação */
body.apres{font-size:16px}
body.apres #raiz{max-width:none;padding:14px 28px}
body.apres .titulo{font-size:34px}
body.apres .kpi .v{font-size:32px}
body.apres .no .nome,body.apres .no .pct{font-size:14px}
.nav-apres{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}

@media (max-width:760px){.arv-cols{grid-template-columns:1fr!important}.rk{grid-template-columns:minmax(0,1fr) 70px 46px}}
</style>
</head>

async function obterDados(trimestre, forcar) {
  const chave = 'painel-okrs:' + trimestre;
  if (!forcar) {
    try {
      const c = JSON.parse(localStorage.getItem(chave) || 'null');
      if (c && Date.now() - c.em < CONFIG.horasCache * 3600e3) return c;
    } catch (e) {}
  }
  const dados = CONFIG.fonte === 'demo' ? structuredClone(DEMO[trimestre]) : await lerDadosFirebase(trimestre);
  if (!dados) return null;
  const pacote = { em: Date.now(), dados };
  try { localStorage.setItem(chave, JSON.stringify(pacote)); } catch (e) {}
  return pacote;
}

/* =====================================================================
   MONTAGEM DO MODELO DE CADA PÁGINA (a partir dos dados, sem nada fixo)
   ===================================================================== */
function modeloPagina(dados, pagina) {
  const cfg = CONFIG.paginas[pagina];
  const pessoas = dados.pessoas;
  const porId = Object.fromEntries(pessoas.map(p => [p.id, p]));
  const filhos = id => pessoas.filter(p => p.pai === id).sort((a, b) => (NIVEL[a.nivel] ?? 9) - (NIVEL[b.nivel] ?? 9));

  if (!cfg.area) {
    const raiz = pessoas.find(p => p.nivel === 'CEO');
    const heads = pessoas.filter(p => p.nivel === 'HEAD');
    const ordemAreas = Object.values(CONFIG.paginas).map(p => p.area).filter(Boolean);
    heads.sort((a, b) => ordemAreas.indexOf(a.area) - ordemAreas.indexOf(b.area));
    const diretos = raiz ? filhos(raiz.id).filter(p => p.nivel !== 'HEAD') : [];
    const grupos = heads.map(h => ({ nome: tituloArea(h.area), itens: [{ p: h, nivel: 0 }], link: paginaDaArea(h.area) }));
    if (diretos.length) grupos.push({ nome: 'Ligados ao CEO', itens: diretos.map(p => ({ p, nivel: 0 })) });
    return { raiz, grupos, todas: [raiz, ...heads, ...diretos].filter(Boolean), bhag: dados.bhag };
  }

  const raiz = pessoas.find(p => p.nivel === 'HEAD' && p.area === cfg.area);
  if (!raiz) return { raiz: null, grupos: [], todas: [] };
  const lista = [];
  (function desce(id, nivel) { for (const f of filhos(id)) { if (f.area && f.area !== cfg.area) continue; lista.push({ p: f, nivel }); desce(f.id, nivel + 1); } })(raiz.id, 0);
  // inclui quem é da área mas ainda não tem líder ligado
  pessoas.filter(p => p.area === cfg.area && p !== raiz && !lista.some(i => i.p === p)).forEach(p => lista.push({ p, nivel: 0 }));
  const grupos = [];
  for (const it of lista) {
    const nome = it.p.grupo || 'Outros';
    let g = grupos.find(x => x.nome === nome);
    if (!g) grupos.push(g = { nome, itens: [] });
    g.itens.push(it);
  }
  const ordemGrupo = n => pessoas.findIndex(p => p.area === cfg.area && (p.grupo || 'Outros') === n);
  grupos.sort((a, b) => ordemGrupo(a.nome) - ordemGrupo(b.nome));
  for (const g of grupos) { const min = Math.min(...g.itens.map(i => i.nivel)); g.itens.forEach(i => i.nivel -= min); }
  return { raiz, grupos, todas: [raiz, ...lista.map(i => i.p)], porId };
}
const paginaDaArea = area => Object.keys(CONFIG.paginas).find(k => CONFIG.paginas[k].area === area);
const tituloArea = area => { const k = paginaDaArea(area); return k ? CONFIG.paginas[k].titulo : area; };

}
function visCards(m) {
  return `<div class="secao up">${esc(m.raiz.cargo)}</div><div class="cards">${cartao(m.raiz)}</div>` +
    m.grupos.map(g => `<div class="secao up">${esc(g.nome)}</div><div class="cards">${g.itens.map(i => cartao(i.p)).join('')}</div>`).join('');
}

function visRanking(m) {
  const itens = m.todas.flatMap(p => p.okrs.map((o, i) => ({ p, o, i }))).sort((a, b) => a.o.pct - b.o.pct);
  return `<div class="peq mut" style="margin:12px 0 4px">${itens.length} objetivos, do menor para o maior atingimento</div>` +
    itens.map(({ p, o, i }) => `<div class="rk" onclick="abrirOkr(${reg(p)},${i})">
      <div style="min-width:0"><div class="el">${esc(o.titulo)}</div><div class="peq mut el">${esc(p.nome)} · ${esc(o.codigo)}</div></div>
      ${barra(o.pct)}<div class="b" style="text-align:right">${fmt0(o.pct)}</div></div>`).join('');
}

function visCalor(m) {
  const n = Math.max(1, ...m.todas.map(p => p.okrs.length));
  const cab = `<div></div>${Array.from({ length: n }, (_, i) => `<div class="peq mut" style="text-align:center">${i + 1}</div>`).join('')}<div class="peq mut b" style="text-align:center">Geral</div>`;
  const linhas = m.todas.map(p => {
    const k = reg(p);
    const cels = Array.from({ length: n }, (_, i) => {
      const o = p.okrs[i];
      if (!o) return '<div class="cel vazia"></div>';
      const c = corCelula(o.pct);
      return `<div class="cel" title="${esc(o.codigo + ' · ' + o.titulo)}" style="background:${c[0]};color:${c[1]}" onclick="abrirOkr(${k},${i})">${fmt0(o.pct)}</div>`;
    }).join('');
    const c = corCelula(p.pct);
    return `<div class="el" style="padding:7px 0;cursor:pointer" onclick="abrirPessoa(${k})" title="${esc(p.cargo)}"><span class="b">${esc(p.nome)}</span></div>${cels}<div class="cel" style="background:${c[0]};color:${c[1]};outline:1px solid rgba(17,17,17,.15)" onclick="abrirPessoa(${k})">${fmt0(p.pct)}</div>`;
  }).join('');
  return `<div class="peq mut" style="margin:12px 0 6px">Colunas = objetivos 1, 2, 3… de cada pessoa. Passe o mouse para ver o nome.</div>
  <div class="calor" style="grid-template-columns:minmax(120px,190px) repeat(${n},minmax(42px,1fr)) minmax(52px,70px)">${cab}${linhas}</div>`;
}

function visEvolucao(atual, ant) {
  if (!ant) return `<div class="centro mut">Ainda não há trimestre anterior a ${esc(triLabel(S.tri))} para comparar.</div>`;
  const idx = d => Object.fromEntries(d.pessoas.map(p => [p.id, p]));
  const A = idx(ant.dados);
  const d = (a, b) => (a == null || b == null) ? null : a - b;
  const fd = v => v == null ? '<span class="mut">novo</span>' : `<span style="color:${v > 0.05 ? 'var(--verde)' : v < -0.05 ? 'var(--vermelho)' : 'var(--cinza-escuro)'}">${v > 0.05 ? '▲' : v < -0.05 ? '▼' : '='} ${Math.abs(Math.round(v * 10) / 10).toFixed(1).replace('.', ',')} p.p.</span>`;
  const bloco = (p, rot) => {
    const pa = A[p.id];
    const okrsAnt = pa ? Object.fromEntries(pa.okrs.map(o => [o.codigo + '|' + o.titulo, o.pct])) : {};
    return `<div class="ev-area">
      <div class="linha" style="justify-content:space-between;flex-wrap:wrap">
        <div style="min-width:0"><div class="peq mut up">${esc(rot)}</div><div class="b" style="font-size:15px;cursor:pointer" onclick="abrirPessoa(${reg(p)})">${esc(p.nome)}</div></div>
        <div class="linha" style="gap:14px"><span class="mut peq">${esc(triLabel(ant.dados.trimestre))} ${fmt(pa?.pct)}</span><span class="b" style="font-size:20px">${fmt(p.pct)}</span><span class="delta">${fd(d(p.pct, pa?.pct))}</span></div>
      </div>
      <div style="margin-top:8px">
        <div class="ev-lin peq mut"><span>Objetivo</span><span style="text-align:right">${esc(triLabel(ant.dados.trimestre).split(' ')[0])}</span><span style="text-align:right">${esc(triLabel(S.tri).split(' ')[0])}</span><span style="text-align:right">Variação</span></div>
        ${p.okrs.map((o, i) => { const v0 = okrsAnt[o.codigo + '|' + o.titulo]; return `<div class="ev-lin" style="cursor:pointer" onclick="abrirOkr(${reg(p)},${i})"><span class="el">${esc(o.codigo)} · ${esc(o.titulo)}</span><span class="mut" style="text-align:right">${fmt0(v0)}</span><span class="b" style="text-align:right">${fmt0(o.pct)}</span><span class="delta">${fd(d(o.pct, v0))}</span></div>`; }).join('')}
      </div></div>`;
  };
  const pessoas = atual.dados.pessoas;
  const ceo = pessoas.find(p => p.nivel === 'CEO');
  const ordem = Object.values(CONFIG.paginas).map(p => p.area).filter(Boolean);
  const heads = pessoas.filter(p => p.nivel === 'HEAD').sort((a, b) => ordem.indexOf(a.area) - ordem.indexOf(b.area));
  const resumo = heads.map(h => { const v = d(h.pct, A[h.id]?.pct); return { h, v }; });
  return `<div class="kpis">${resumo.map(({ h, v }) => `<div class="kpi" style="cursor:pointer" onclick="abrirPessoa(${reg(h)})"><div class="peq mut up">${esc(tituloArea(h.area))}</div><div class="linha" style="justify-content:space-between;align-items:baseline"><span class="v">${fmt0(h.pct)}</span><span class="delta peq">${fd(v)}</span></div></div>`).join('')}</div>
    ${ceo ? bloco(ceo, 'CEO') : ''}${heads.map(h => bloco(h, tituloArea(h.area))).join('')}`;
}

function cabecalho(idv, m) {
  const cfg = CONFIG.paginas[S.pagina];
  const ehEv = cfg.especial === 'evolucao';
  const urlApres = (() => { const u = new URL(location.href); u.searchParams.set('modo', 'apresentacao'); u.searchParams.set('pagina', S.pagina); return u.toString(); })();
  return `<div class="cab">
    <div><div class="marca up b">${esc(idv.nome)} · Plano de objetivos</div><div class="titulo up">${esc(cfg.titulo)}</div></div>
    <div class="barra-ferr">
      <select class="btn" aria-label="Trimestre" onchange="trocarTrimestre(this.value)">${S.tris.map(t => `<option value="${esc(t)}" ${t === S.tri ? 'selected' : ''}>${esc(triLabel(t))}</option>`).join('')}</select>
      ${ehEv ? '' : `<span class="grupo-btn">${ROTULOS_VIS.map(([k, r]) => `<button class="btn ${S.vis === k ? 'on' : ''}" onclick="trocarVis('${k}')">${r}</button>`).join('')}</span>`}
      <button class="btn" onclick="S.sem=!S.sem;render()" title="Liga e desliga as cores de semáforo"><span class="ponto" style="background:${S.sem ? 'var(--verde)' : 'var(--cinza-claro)'}"></span>Semáforo</button>
      <button class="btn" onclick="atualizar()" title="Buscar dados novos agora">Atualizar</button>
      ${S.apres ? '' : `<a class="btn" href="${esc(urlApres)}" target="_blank" rel="noopener" style="text-decoration:none">Apresentação ↗</a>`}
      <a class="btn" href="${esc(CONFIG.urlApp)}" target="_blank" rel="noopener" style="text-decoration:none">Abrir no app ↗</a>
    </div>
  </div>`;
}

function indicadores(m) {
  const objs = m.todas.flatMap(p => p.okrs);
  const abaixo = objs.filter(o => o.pct < CONFIG.semaforo.amarelo).length;
  const cards = [];
  if (m.bhag) cards.push(`<div class="kpi"><div class="peq mut el">BHAG · ${esc(m.bhag.titulo)}</div><div class="v">${fmt(m.bhag.pct)}</div></div>`);
  cards.push(`<div class="kpi"><div class="peq mut el">${m.raiz.nome === m.raiz.cargo ? esc(m.raiz.cargo) : esc(m.raiz.nome) + ' · ' + esc(m.raiz.cargo)}</div><div class="v" ${S.sem ? `style="color:${corSem(m.raiz.pct)}"` : ''}>${fmt(m.raiz.pct)}</div></div>`);
  cards.push(`<div class="kpi"><div class="peq mut">Pessoas</div><div class="v">${m.todas.length}</div></div>`);
  cards.push(`<div class="kpi"><div class="peq mut">Objetivos abaixo de ${CONFIG.semaforo.amarelo}%</div><div class="v">${abaixo} <span class="peq mut">de ${objs.length}</span></div></div>`);
  return `<div class="kpis">${cards.join('')}</div>`;
}

function navApresentacao() {
  if (!S.apres) return '';
  const ks = Object.keys(CONFIG.paginas);
  return `<div class="nav-apres">
    <button class="btn" onclick="passo(-1)" aria-label="Anterior">◀</button>
    ${ks.map(k => `<button class="btn ${k === S.pagina ? 'on' : ''}" onclick="irPara('${k}')">${esc(CONFIG.paginas[k].titulo)}</button>`).join('')}
    <button class="btn" onclick="passo(1)" aria-label="Próxima">▶</button>
    <button class="btn ${S.auto ? 'on' : ''}" onclick="alternarAuto()">${S.auto ? 'Pausar' : 'Passar sozinho'}</button>
    <span class="peq mut">Use as setas do teclado para navegar</span>
  </div>`;
}

function render() {
  REG = [];
  const raiz = $('#raiz');
  const idv = aplicarIdv(S.pagina);
  document.body.classList.toggle('apres', S.apres);
  if (!S.pacote) { raiz.innerHTML = navApresentacao() + `<div class="centro mut">Sem dados para ${esc(triLabel(S.tri))}.</div>`; return; }
  const cfg = CONFIG.paginas[S.pagina];
  let corpo, m = null;
  if (cfg.especial === 'evolucao') {
    corpo = visEvolucao(S.pacote, S.anterior);
  } else {
    m = modeloPagina(S.pacote.dados, S.pagina);
    if (!m.raiz) corpo = `<div class="centro mut">Nenhum Head encontrado para ${esc(cfg.titulo)} em ${esc(triLabel(S.tri))}.</div>`;
    else corpo = indicadores(m) + ({ arvore: visArvore, cards: visCards, ranking: visRanking, calor: visCalor }[S.vis] || visArvore)(m);
  }
  const em = new Date(S.pacote.em);
  const demo = CONFIG.fonte === 'demo'
    ? `<div class="aviso">Dados de demonstração: o T3 é o export de 23/10/2026; o T2 é fictício, só para testar a página de evolução. Troque <b>CONFIG.fonte</b> para 'firebase' quando a leitura estiver ligada.</div>` : '';
  raiz.innerHTML = navApresentacao() + cabecalho(idv, m) + corpo + demo +
    `<div class="rodape"><span>Atualizado em ${em.toLocaleDateString('pt-BR')} às ${em.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</span><span>Atualiza automaticamente a cada ${CONFIG.horasCache} h</span></div>`;
  avisarAltura();
}

/* Detalhe de pessoa e de objetivo */
function fecharDetalhe() { $('#detalhe').innerHTML = ''; }
function modal(html) {
  $('#detalhe').innerHTML = `<div class="veu" onclick="if(event.target===this)fecharDetalhe()"><div class="modal">${html}</div></div>`;
}
function abrirPessoa(k) {
  const p = REG[k];
  const pg = p.nivel === 'HEAD' && S.pagina !== paginaDaArea(p.area) ? paginaDaArea(p.area) : null;
  modal(`<div class="linha" style="justify-content:space-between;align-items:flex-start">
      <div><div class="b" style="font-size:17px">${esc(p.nome)}</div><div class="mut peq">${esc(p.cargo)}${p.grupo ? ' · ' + esc(p.grupo) : ''}</div></div>
      <button class="btn" onclick="fecharDetalhe()" aria-label="Fechar">✕</button></div>
    <div class="linha" style="margin:12px 0"><div style="flex:1">${barra(p.pct)}</div><span class="b" style="font-size:22px">${fmt(p.pct)}</span></div>
    ${p.okrs.map((o, i) => `<div class="rk" style="grid-template-columns:minmax(0,1fr) 110px 48px" onclick="abrirOkr(${k},${i})"><span class="el">${esc(o.codigo)} · ${esc(o.titulo)}</span>${barra(o.pct)}<span class="b" style="text-align:right">${fmt0(o.pct)}</span></div>`).join('')}
    <div class="linha" style="justify-content:flex-end;gap:6px;margin-top:12px">
      ${pg ? `<button class="btn" onclick="fecharDetalhe();irPara('${pg}')">Ver página ${esc(CONFIG.paginas[pg].titulo)}</button>` : ''}
      <a class="btn" href="${esc(CONFIG.urlApp)}" target="_blank" rel="noopener" style="text-decoration:none">Abrir no app ↗</a>
    </div>`);
}
function abrirOkr(k, i) {
  const p = REG[k], o = p.okrs[i];
  const krs = (o.krs && o.krs.length)
    ? o.krs.map(kr => `<div class="kr"><div class="linha" style="justify-content:space-between"><span>${esc(kr.titulo)}</span><span class="b">${fmt0(kr.pct)}</span></div>
        <div class="peq mut">${kr.meta != null ? 'Meta ' + esc(kr.meta) : ''}${kr.atual != null ? ' · Atual ' + esc(kr.atual) : ''}${kr.peso != null ? ' · Peso ' + esc(kr.peso) : ''}</div>${barra(kr.pct)}</div>`).join('')
    : `<div class="kr mut">Os key results, metas e pesos aparecem aqui quando a leitura do Firebase estiver ligada.</div>`;
  modal(`<div class="linha" style="justify-content:space-between;align-items:flex-start">
      <div><div class="mut peq">${esc(o.codigo)} · ${esc(p.nome)}</div><div class="b" style="font-size:17px">${esc(o.titulo)}</div></div>
      <div class="linha"><button class="btn" onclick="abrirPessoa(${k})">◀ Voltar</button><button class="btn" onclick="fecharDetalhe()" aria-label="Fechar">✕</button></div></div>
    <div class="linha" style="margin:12px 0"><div style="flex:1">${barra(o.pct)}</div><span class="b" style="font-size:22px">${fmt(o.pct)}</span></div>
    <div style="display:grid;gap:6px">${krs}</div>
    <div class="linha" style="justify-content:flex-end;margin-top:12px"><a class="btn" href="${esc(CONFIG.urlApp)}" target="_blank" rel="noopener" style="text-decoration:none">Abrir no app ↗</a></div>`);
}

/* Ações */
function trocarVis(v) { S.vis = v; render(); }
async function trocarTrimestre(t) { S.tri = t; await carregar(false); }
async function atualizar() { await carregar(true); }
function irPara(pg) {
  S.pagina = pg;
  const u = new URL(location.href); u.searchParams.set('pagina', pg); history.replaceState(null, '', u);
  fecharDetalhe(); render();
}
function passo(d) { const ks = Object.keys(CONFIG.paginas); irPara(ks[(ks.indexOf(S.pagina) + d + ks.length) % ks.length]); }
function alternarAuto() {
  if (S.auto) { clearInterval(S.auto); S.auto = null; }
  else S.auto = setInterval(() => passo(1), CONFIG.segundosApresentacao * 1000);
  render();
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') fecharDetalhe();
  if (!S.apres || $('#detalhe').innerHTML) return;
  if (e.key === 'ArrowRight') passo(1);
  if (e.key === 'ArrowLeft') passo(-1);
});

/* Ajuda o SharePoint a dimensionar o iframe quando possível */
function avisarAltura() { try { parent.postMessage({ painelOkrsAltura: document.documentElement.scrollHeight }, '*'); } catch (e) {} }

/* Carregamento e login */
async function carregar(forcar) {
  const raiz = $('#raiz');
  try {
    if (!S.tris.length) S.tris = await listarTrimestres();
    if (!S.tri) S.tri = S.tris[0];
    S.pacote = await obterDados(S.tri, forcar);
    const i = S.tris.indexOf(S.tri);
    S.anterior = S.tris[i + 1] ? await obterDados(S.tris[i + 1], forcar) : null;
    render();
  } catch (e) {
    console.error(e);
    raiz.innerHTML = `<div class="centro"><div class="b">Não foi possível carregar os OKRs</div><div class="erro">${esc(e.message)}</div><button class="btn" style="margin-top:12px" onclick="carregar(true)">Tentar de novo</button></div>`;
  }
}

function telaLogin(msg) {
  aplicarIdv(S.pagina);
  $('#raiz').innerHTML = `<form class="centro" onsubmit="entrar(event)">
    <div class="marca up b">Plano de objetivos</div><div class="titulo up" style="font-size:20px;margin-bottom:6px">Entrar</div>
    <div class="mut peq">Use o mesmo login do app de OKRs.</div>
    <input id="email" type="email" placeholder="nome@empresa.com.br" autocomplete="username" required>
    <input id="senha" type="password" placeholder="Senha" autocomplete="current-password" required>
    ${msg ? `<div class="erro">${esc(msg)}</div>` : ''}
    <button class="btn on" style="margin-top:12px;padding:7px 16px;font-size:13px" type="submit">Entrar</button></form>`;
}
async function entrar(ev) {
  ev.preventDefault();
  try {
    const { auth, authMod } = await iniciarFirebase();
    await authMod.signInWithEmailAndPassword(auth, $('#email').value.trim(), $('#senha').value);
  } catch (e) { telaLogin('E-mail ou senha inválidos.'); }
}

(async function iniciar() {
  if (CONFIG.fonte === 'demo') { carregar(false); return; }
  $('#raiz').innerHTML = '<div class="centro mut">Carregando…</div>';
  try {
    const { auth, authMod } = await iniciarFirebase();
    authMod.onAuthStateChanged(auth, u => u ? carregar(false) : telaLogin());
  } catch (e) { $('#raiz').innerHTML = `<div class="centro erro">Falha ao iniciar o Firebase: ${esc(e.message)}</div>`; }
})();
</script>
